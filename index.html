<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edge">
<meta name="theme-color" content="#0f1511">
<title>Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, sticky header with tally, tab bar fixed at the bottom */
:root{
  --bg:#f3f5f1; --card:#ffffff; --fg:#17201a; --muted:#5d6a61; --line:#dde3dc; --chip:#e9eee8;
  --accent:#c98a12; --accent-ink:#ffffff; --win:#1d8a4a; --win-bg:#e3f4ea; --loss:#c2362f; --loss-bg:#fbe7e5; --warn-bg:#fff4dc;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --card:#18201b; --fg:#e8eee9; --muted:#93a198; --line:#28322b; --chip:#222c25;
  --accent:#e8a92c; --accent-ink:#1a1405; --win:#4cc27f; --win-bg:#16301f; --loss:#f06a61; --loss-bg:#3a1c1a; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --card:#18201b; --fg:#e8eee9; --muted:#93a198; --line:#28322b; --chip:#222c25;
  --accent:#e8a92c; --accent-ink:#1a1405; --win:#4cc27f; --win-bg:#16301f; --loss:#f06a61; --loss-bg:#3a1c1a; --warn-bg:#3a2e12; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;line-height:1;letter-spacing:.02em;text-transform:uppercase}
h1 small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:34px;padding:0 10px;cursor:pointer;font-size:13px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--win)} .neg{color:var(--loss)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:620px}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:18px;line-height:1}
nav.tabs button.on{color:var(--fg)}
nav.tabs button.on .ic{color:var(--accent)}
nav.tabs .badge{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-size:10px;margin-left:3px}

section{margin-top:18px}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.card.W{background:var(--win-bg);border-color:var(--win)} .card.L{background:var(--loss-bg);border-color:var(--loss)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.edge{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--fg)}
.star{color:var(--accent)}
.match{font-weight:600;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.pick{font-size:14px;margin-top:1px}
.pick b{font-weight:600}
.meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer}
.chip.sel{border-color:var(--accent)}
.tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--chip);border-radius:4px;padding:2px 6px;color:var(--fg)}
.tag.pos-tag{background:var(--warn-bg)}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;gap:3px}
input[type=number],input[type=text],input[type=email],input[type=password],select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;width:100%;min-width:0}
.check{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
.warn{background:var(--warn-bg);border-radius:8px;padding:8px 10px;font-size:13px}
.calc{font-size:13px;color:var(--muted)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center}
.time{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.time small{display:block;font-family:var(--f-body);font-weight:500;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.started .time{color:var(--accent)}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ret{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.card.W .ret{color:var(--win)} .card.L .ret{color:var(--loss)}
.wl{display:flex;gap:4px}
.wl button{width:32px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:12px}
.card.W .wl .w{background:var(--win);border-color:var(--win);color:#fff}
.card.L .wl .l{background:var(--loss);border-color:var(--loss);color:#fff}
.card.P .wl .p,.card.V .wl .v{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.daynav b{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 6px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv .card b{display:block;font-family:var(--f-display);font-size:21px;font-weight:800;line-height:1.05}
.kv .card span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{color:var(--fg);border-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.login{max-width:360px;margin:16vh auto 0;display:grid;gap:12px}
.login h1{font-size:44px}
.ptbl{margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ptbl .held{font-size:12.5px;margin-bottom:4px}
.ptbl table{font-size:12.5px}
.ptbl td,.ptbl th{padding:4px 4px}
.ptbl tr.worst td{font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="loginView" class="wrap" hidden>
  <form class="login" id="loginForm">
    <h1>Edge</h1>
    <p class="calc">Sign in to your betting dashboard.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="loginErr" class="warn" hidden></p>
  </form>
</div>

<div id="appView" hidden>
  <div class="wrap">
    <header>
      <div class="hrow">
        <h1>Edge <small id="subtitle"></small></h1>
        <button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh">↻ Refresh</button>
      </div>
      <div class="tally">
        <div class="stat"><span>Pending</span><b id="tPending">0</b></div>
        <div class="stat"><span>Open bets</span><b id="tOpen">0</b></div>
        <div class="stat"><span>Open stake</span><b id="tStake">€0</b></div>
        <div class="stat"><span>Profit</span><b id="tProfit">€0</b></div>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <nav class="tabs" aria-label="Sections"><div class="in">
    <button type="button" data-tab="pending"><span class="ic">◉</span><span>Pending<span class="badge" id="nPending" hidden></span></span></button>
    <button type="button" data-tab="fixtures"><span class="ic">◷</span><span>Fixtures</span></button>
    <button type="button" data-tab="log"><span class="ic">≡</span><span>Log</span></button>
    <button type="button" data-tab="summary"><span class="ic">∑</span><span>Summary</span></button>
  </div></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====================================================================== config
const SB_URL = "https://qblpkkvfodmyxbbbcodn.supabase.co";
const SB_KEY = "sb_publishable_Fe21K84UCsnaRfUjIOMnwg_l7qDzUwV";   // publishable key: safe in a page, tables are locked to your login
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// ====================================================================== state
const S = { settings:{}, books:[], flags:[], bets:[], tab:"pending", logView:"open", day:null, open:{} };
let TAB = "pending";
try { TAB = localStorage.getItem("edge-tab") || "pending"; } catch(e) {}

// ====================================================================== helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const eur = v => (v < 0 ? "−€" : "€") + Math.abs(v).toFixed(2);
const sgn = v => (v > 0 ? "+" : "") + eur(v);
const num = v => (v === null || v === undefined || v === "") ? null : Number(v);
const fmtLine = l => (l === null || l === undefined) ? "" : ((+l > 0 && false) ? "+" : "") + (+l);
function pickText(x){ const l = x.line; if (l === null || l === undefined) return x.outcome;
  if (x.market === "spreads") return `${x.outcome} ${+l > 0 ? "+" : ""}${+l}`; return `${x.outcome} ${+l}`; }
function ko(t){ return new Date(t); }
function hhmm(t){ return ko(t).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" }); }
function dayLabel(t){ return ko(t).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }); }
function kickTxt(t){ const d = ko(t), n = new Date(); const same = d.toDateString() === n.toDateString();
  return (same ? "Today" : d.toLocaleDateString("en-GB", { weekday:"short" })) + " " + hhmm(t); }
// betting day: games before 06:00 belong to the previous day (US night games)
function bettingDay(t){ return localISO(new Date(ko(t).getTime() - 6*3600e3)); }
function localISO(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function todayDay(){ return localISO(new Date(Date.now() - 6*3600e3)); }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
function bookObj(name){ return S.books.find(b => b.name === name); }
function setting(k, d){ const v = S.settings[k]; return (v === undefined || v === null) ? d : v; }

function kelly(odds, fair, book){
  odds = +odds; fair = +fair;
  if (!(odds > 1) || !(fair > 1)) return 0;
  const br = +setting("bankroll", 500), kf = +setting("kelly_fraction", 1), cap = +setting("stake_cap_pct", 0.02);
  let k = Math.max(0, (odds/fair - 1) / (odds - 1));
  const raw = Math.min(k * br * kf, br * cap);
  if (!(raw > 0)) return 0;
  let st = Math.max(0.5, Math.floor(raw * 2 + 0.5) / 2);                   // nearest €0.50
  const b = typeof book === "string" ? bookObj(book) : book;
  if (b && b.max_win) st = Math.min(st, Math.max(0.5, Math.floor((+b.max_win) / (odds - 1) * 2) / 2));   // win limit: round down
  return st;
}
function edgePct(odds, fair){ return (fair > 0 && odds > 0) ? (odds/fair - 1) * 100 : 0; }
function selKey(x){ return `${x.event_id}|${x.market}|${x.outcome}|${x.line === null || x.line === undefined ? "" : +x.line}`; }
function openBets(){ return S.bets.filter(b => !b.result); }

// ====================================================================== POSITION (same match, more than one bet)
const NO_DRAW = /^(basketball|americanfootball|baseball|icehockey|tennis|mma|boxing)/;
function betPL(b, m, t, home){            // profit of bet b if final margin (home-away) = m and total = t
  const st = +b.stake, win = st * (+b.odds - 1), L = b.line === null || b.line === undefined ? null : +b.line;
  let x;                                   // >0 win, 0 push, <0 loss
  if (b.market === "h2h") x = b.outcome.toLowerCase() === "draw" ? (m === 0 ? 1 : -1) : (b.outcome === home ? m : -m);
  else if (b.market === "totals") x = b.outcome.toLowerCase().startsWith("over") ? t - L : L - t;
  else x = b.outcome === home ? m + L : L - m;
  return x > 0 ? win : x < 0 ? -st : 0;
}
function buckets(lo, hi, vec, splitAt){   // group consecutive integers with identical P/L vectors
  const out = [];
  for (let v = lo; v <= hi; v++){
    const k = vec(v); if (k === null) continue;
    const last = out[out.length - 1];
    if (last && last.key === k && !splitAt(last.b, v) && last.b === v - 1) last.b = v;
    else out.push({ a:v, b:v, key:k });
  }
  if (out.length){ out[0].openLo = true; out[out.length - 1].openHi = true; }
  return out;
}
function positionRows(f, newBet){
  const held = openBets().filter(b => b.event_id === f.event_id);
  const all = held.concat(newBet ? [newBet] : []);
  const home = f.home, away = f.away, draws = !NO_DRAW.test(f.sport_key || "");
  const useM = all.some(b => b.market !== "totals"), useT = all.some(b => b.market === "totals");
  const mc = [0], tc = [];
  for (const b of all){ const L = +b.line;
    if (b.market === "spreads") mc.push(b.outcome === home ? -L : L);
    if (b.market === "totals") tc.push(L); }
  const mKey = m => (!draws && m === 0) ? null : all.map(b => b.market === "totals" ? 0 : betPL(b, m, 999, home)).join() + "|" + Math.sign(m);
  const tKey = t => all.map(b => b.market === "totals" ? betPL(b, 0, t, home) : 0).join();
  const mB = useM ? buckets(Math.floor(Math.min(...mc)) - 1, Math.ceil(Math.max(...mc)) + 1, mKey, (prev, v) => Math.sign(prev) !== Math.sign(v)) : [{ a:-99, b:99, any:true }];
  const tB = useT ? buckets(Math.max(0, Math.floor(Math.min(...tc)) - 1), Math.ceil(Math.max(...tc)) + 1, tKey, () => false) : [{ a:0, b:999, any:true }];
  if (useT){ tB[0].a = 0; }
  const short = n => n.length > 14 ? n.split(" ").slice(-1)[0] : n;
  const mLab = r => { if (r.any) return "";
    if (r.a === 0 && r.b === 0) return "Draw";
    if (r.a > 0) return r.openHi ? (r.a === 1 ? `${short(home)} win` : `${short(home)} by ${r.a}+`) : (r.a === r.b ? `${short(home)} by ${r.a}` : `${short(home)} by ${r.a}–${r.b}`);
    const A = -r.b, B = -r.a;
    return r.openLo ? (A === 1 ? `${short(away)} win` : `${short(away)} by ${A}+`) : (A === B ? `${short(away)} by ${A}` : `${short(away)} by ${A}–${B}`); };
  const tLab = r => { if (r.any) return "";
    if (r.openHi) return `${r.a}+ total`; if (r.a === 0 && r.openLo) return `${r.b} or fewer`;
    return r.a === r.b ? `${r.a} total` : `${r.a}–${r.b} total`; };
  const hiM = r => r.openHi ? r.b + 40 : r.b, loM = r => r.openLo ? r.a - 40 : r.a, hiT = r => r.openHi ? r.b + 60 : r.b;
  const rows = [];
  for (const mr of mB) for (const tr of tB){
    let m0 = null, t0 = null;                // find a real score in this cell (|margin| <= total, same parity)
    if (useM) for (let m = loM(mr); m <= hiM(mr) && m0 === null; m++){
      if (!draws && m === 0) continue;
      if (!useT){ m0 = m; t0 = Math.max(Math.abs(m), 1); break; }
      for (let t = tr.a; t <= hiT(tr); t++) if (t >= Math.abs(m) && (t - m) % 2 === 0){ m0 = m; t0 = t; break; }
    }
    if (m0 === null && useM) continue;
    if (!useM){ m0 = 0; t0 = tr.a; }
    const now = held.reduce((a,b) => a + betPL(b, m0, t0, home), 0);
    const add = newBet ? betPL(newBet, m0, t0, home) : 0;
    rows.push({ label:[mLab(mr), tLab(tr)].filter(Boolean).join(", "), now, with: now + add, loses: add < 0 });
  }
  return { held, rows };
}
function posPanel(f){
  const st = S.open[f.id];
  const mine = (f.books && f.books.mine) || [];
  let odds, stake;
  if (st && st.mode === "accept"){ odds = num(st.odds); stake = st.stakeEdited ? num(st.stake) : kelly(odds, +f.fair_odds, st.book); }
  else { odds = mine[0] ? +mine[0].price : +f.flag_odds; stake = mine[0] ? +mine[0].stake : kelly(odds, +f.fair_odds, f.my_book); }
  const nb = (odds > 1 && stake > 0) ? { market:f.market, outcome:f.outcome, line:f.line, odds, stake } : null;
  const { held, rows } = positionRows(f, nb);
  if (!held.length) return "";
  const worst = Math.min(...rows.map(r => r.with)), limit = 0.02 * (+setting("bankroll", 500));
  const c = v => v > 0.005 ? "pos" : v < -0.005 ? "neg" : "";
  const fmt = v => Math.abs(v) < 0.005 ? "€0" : sgn(v);
  return `<div class="ptbl">
    <div class="held"><b>You hold:</b> ${held.map(b => `${esc(pickText(b))} @ ${(+b.odds).toFixed(2)} · €${(+b.stake).toFixed(2)} ${esc(b.book)}`).join("; ")}</div>
    <table><thead><tr><th>If it ends</th><th>Now</th><th>${nb ? `+ this €${stake.toFixed(2)}` : "+ this"}</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${Math.abs(r.with - worst) < 0.005 ? "worst" : ""}"><td>${esc(r.label)}</td><td class="${c(r.now)}">${fmt(r.now)}</td><td class="${c(r.with)}">${fmt(r.with)}</td></tr>`).join("")}
    </tbody></table>
    ${nb && worst < -limit - 0.005 ? (() => { const sMax = Math.floor((limit + Math.min(...rows.filter(r => r.loses).map(r => r.now))) * 100) / 100;
      return `<div class="warn" style="margin-top:6px">Worst case is ${eur(worst)}, over your 2-unit limit of €${limit.toFixed(2)}. ${sMax >= 0.5 ? `Max stake to stay inside it: <b>€${sMax.toFixed(2)}</b>.` : "Skip this one."}</div>`; })() : ""}
  </div>`;
}

// ====================================================================== data
async function loadAll(){
  const since = new Date(Date.now() - 3*3600e3).toISOString();
  const [st, bk, fl, bt] = await Promise.all([
    sb.from("settings").select("key,value"),
    sb.from("books").select("*").order("name"),
    sb.from("flags").select("*").eq("status","pending").gte("commence_time", since).order("commence_time"),
    sb.from("bets").select("*").order("commence_time", { ascending:false }).limit(2000),
  ]);
  for (const r of [st, bk, fl, bt]) if (r.error) throw r.error;
  S.settings = Object.fromEntries(st.data.map(r => [r.key, r.value]));
  S.books = bk.data; S.flags = fl.data; S.bets = bt.data;
}
async function refresh(quiet){
  try { await loadAll(); render(); if (!quiet) toast("Up to date"); }
  catch(e){ toast("Couldn't load: " + (e.message || e)); }
}

// ====================================================================== header + tabs
function renderHeader(){
  const settled = S.bets.filter(b => b.result);
  const profit = settled.reduce((a,b) => a + (+b.profit || 0), 0);
  const ob = openBets();
  const pend = S.flags.filter(f => new Date(f.commence_time) > new Date());
  $("tPending").textContent = pend.length;
  $("tOpen").textContent = ob.length;
  $("tStake").textContent = "€" + Math.round(ob.reduce((a,b) => a + +b.stake, 0));
  const tp = $("tProfit"); tp.textContent = sgn(profit); tp.className = profit > 0 ? "pos" : profit < 0 ? "neg" : "";
  const n = $("nPending"); n.hidden = !pend.length; n.textContent = pend.length;

function render(){

// ====================================================================== PENDING
function viewPending(){
  const now = new Date();
  const ob = openBets();
  const evOpen = new Set(ob.map(b => b.event_id).filter(Boolean));
  const flags = S.flags.filter(f => new Date(f.commence_time) > now)
    .sort((a,b) => (b.usable - a.usable) || (b.edge_pct - a.edge_pct));
  if (!flags.length) return `<div class="empty">No pending flags.<br>Run a scan from Telegram (/scan) and new ones appear here.</div>`;
  const mine = flags.filter(f => f.usable), check = flags.filter(f => !f.usable);
  const block = (title, arr) => arr.length ? `<section><h2><span>${title}</span><span>${arr.length}</span></h2><div class="list">${arr.map(f => flagCard(f, evOpen)).join("")}</div></section>` : "";
  return block("★ On your books", mine) + block("◦ Check manually", check);
}
function flagCard(f, evOpen){
  const bk = f.books || {}; const mine = bk.mine || [], feed = bk.feed || [], hints = bk.hints || [];
  const pos = evOpen.has(f.event_id);
  const st = S.open[f.id] || null;
  let body = "";
  if (st && st.mode === "accept") body = acceptForm(f, st);
  else if (st && st.mode === "decline") body = `<div class="reasons">
      <button class="btn" data-act="decline" data-id="${f.id}" data-r="no_access">Couldn't find it</button>
      <button class="btn" data-act="decline" data-id="${f.id}" data-r="price_moved">Price moved</button>
      <button class="btn" data-act="decline" data-id="${f.id}" data-r="skipped">Skip</button>
      <button class="btn ghost" data-act="close" data-id="${f.id}">Cancel</button></div>`;
  else body = `<div class="acts"><button class="btn primary" data-act="open-accept" data-id="${f.id}">✓ Placed</button>
      <button class="btn" data-act="open-decline" data-id="${f.id}">✕ Decline</button></div>`;
  return `<div class="card" id="flag-${f.id}">
    <div class="top"><span>${f.usable ? '<span class="star">★</span> ' : '◦ '}${esc(f.sport_title)} · ${kickTxt(f.commence_time)} ${pos ? '<span class="tag pos-tag">Position</span>' : ""}</span>
      <span class="edge">+${(+f.edge_pct).toFixed(1)}%</span></div>
    <div class="match">${esc(f.home)} v ${esc(f.away)}</div>
    <div class="pick"><b>${esc(pickText(f))}</b> · fair <span class="mono">${(+f.fair_odds).toFixed(3)}</span></div>
    <div class="chips">${mine.map(m => `<span class="chip">★ ${esc(m.book)} <span class="mono">${(+m.price).toFixed(2)}</span> · €${(+m.stake).toFixed(2)}${m.capped ? " capped" : ""}</span>`).join("")}
      ${!mine.length ? `<span class="chip">${esc(f.feed_book)} <span class="mono">${(+f.flag_odds).toFixed(2)}</span></span>` : ""}
      ${hints.length ? `<span class="chip">check: ${esc(hints.join(", "))}</span>` : ""}</div>
    ${pos ? `<div id="pos-${f.id}">${posPanel(f)}</div>` : ""}
    <div class="meta"><span>Flagged at: ${feed.slice(0,5).map(x => `${esc(x.book)} ${(+x.price).toFixed(2)}`).join(", ") || esc(f.feed_book)}</span></div>
    ${body}</div>`;
}
function acceptForm(f, st){
  const odds = num(st.odds), fair = +f.fair_odds;
  const auto = kelly(odds, fair, st.book);
  const stake = st.stakeEdited ? num(st.stake) : auto;
  const e = edgePct(odds || 0, fair);
  const active = S.books.filter(b => b.active).map(b => b.name);
  const b = bookObj(st.book);
  return `<div class="form">
    <div class="frow">
      <label>Book<select data-f="book" data-id="${f.id}">${active.map(n => `<option ${n === st.book ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
      <label>Price you got<input type="number" inputmode="decimal" step="0.01" data-f="odds" data-id="${f.id}" value="${odds ?? ""}"></label>
    </div>
    <div class="frow">
      <label>Stake €<input type="number" inputmode="decimal" step="0.01" data-f="stake" data-id="${f.id}" value="${stake ?? ""}"></label>
      <label>Edge<span class="calc" id="calc-${f.id}" style="padding-top:9px">${e.toFixed(2)}% · Kelly €${auto.toFixed(2)}${b && b.max_win ? ` (cap €${b.max_win} win)` : ""}</span></label>
    </div>
    <label class="check"><input type="checkbox" data-f="capped" data-id="${f.id}" ${st.capped ? "checked" : ""}> Book cut my stake</label>
    ${st.capped ? `<label>Max the book offered €<input type="number" inputmode="decimal" step="0.01" data-f="max" data-id="${f.id}" value="${st.max ?? ""}"></label>` : ""}
    <div id="lowedge-${f.id}">${odds && e < 1 ? `<div class="warn">Edge is ${e.toFixed(2)}%, under 1% at this price. Usually a decline.</div>` : ""}</div>
    <div class="acts"><button class="btn primary" id="confirm-${f.id}" data-act="accept" data-id="${f.id}" ${!(odds > 1) || !(stake > 0) ? "disabled" : ""}>Confirm bet</button>
      <button class="btn ghost" data-act="close" data-id="${f.id}">Cancel</button></div></div>`;
}
async function doAccept(f){
  const st = S.open[f.id];
  const odds = +st.odds, stake = st.stakeEdited ? +st.stake : kelly(odds, +f.fair_odds, st.book);
  const row = { flag_id:f.id, event_id:f.event_id, sport_key:f.sport_key, sport_title:f.sport_title, commence_time:f.commence_time,
    home:f.home, away:f.away, market:f.market, outcome:f.outcome, line:f.line, book:st.book,
    flag_odds:f.flag_odds, fair_odds:f.fair_odds, odds, stake, capped:!!st.capped, max_offered: st.capped ? num(st.max) : null,
    notes: st.book !== f.my_book ? `flagged at ${f.feed_book}` : null };
  const r = await sb.from("bets").insert(row).select();
  if (r.error) return toast("Not saved: " + r.error.message);
  const u = await sb.from("flags").update({ status:"accepted" }).eq("id", f.id);
  if (u.error) toast("Bet saved, flag not updated: " + u.error.message);
  delete S.open[f.id];
  S.bets.unshift(r.data[0]); S.flags = S.flags.filter(x => x.id !== f.id);
  toast(`Logged: ${pickText(f)} @ ${odds} · €${stake.toFixed(2)} ${st.book}`);
  render();
}
async function doDecline(f, reason){
  const u = await sb.from("flags").update({ status:"declined", decline_reason:reason, declined_odds:f.flag_odds,
    declined_edge:f.edge_pct, declined_at:new Date().toISOString() }).eq("id", f.id);
  if (u.error) return toast("Not saved: " + u.error.message);
  delete S.open[f.id]; S.flags = S.flags.filter(x => x.id !== f.id);
  toast("Declined"); render();
}

function viewFixtures(){

function betRow(b){

      <div style="min-width:0"><div class="match">${esc(b.home)} v ${esc(b.away)}</div>
        <div class="meta" style="margin-top:2px"><span class="tag">${esc(b.sport_title || "")}</span><span><b style="color:var(--fg)">${esc(pickText(b))}</b> @ ${(+b.odds).toFixed(2)}</span><span class="mono">€${(+b.stake).toFixed(2)} · ${esc(b.book)}</span>${b.settled_by === "auto" ? '<span class="tag">auto</span>' : ""}</div></div>

function betEditor(b){
  const e = S.open["bet-" + b.id];
  return `<div class="form">
    <div class="frow"><label>Price<input type="number" step="0.01" inputmode="decimal" data-bf="odds" data-id="${b.id}" value="${e.odds}"></label>
      <label>Stake €<input type="number" step="0.01" inputmode="decimal" data-bf="stake" data-id="${b.id}" value="${e.stake}"></label></div>
    <div class="frow"><label>Book<select data-bf="book" data-id="${b.id}">${S.books.map(x => `<option ${x.name === e.book ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label>Result<select data-bf="result" data-id="${b.id}">${[["","Open"],["W","Won"],["L","Lost"],["P","Push"],["V","Void"]].map(([v,t]) => `<option value="${v}" ${v === (e.result||"") ? "selected" : ""}>${t}</option>`).join("")}</select></label></div>

}
async function setResult(id, r){
  const b = S.bets.find(x => x.id == id); if (!b) return;
  const newR = b.result === r ? null : r;
  const u = await sb.from("bets").update({ result:newR, settled_at:newR ? new Date().toISOString() : null, settled_by:newR ? "manual" : null }).eq("id", id).select();
  if (u.error) return toast("Not saved: " + u.error.message);
  Object.assign(b, u.data[0]); render();
}
async function saveBet(id){
  const e = S.open["bet-" + id];
  const patch = { odds:+e.odds, stake:+e.stake, book:e.book, result:e.result || null,
    settled_at: e.result ? new Date().toISOString() : null, settled_by: e.result ? "manual" : null };
  const u = await sb.from("bets").update(patch).eq("id", id).select();
  if (u.error) return toast("Not saved: " + u.error.message);
  const b = S.bets.find(x => x.id == id); Object.assign(b, u.data[0]);
  delete S.open["bet-" + id]; toast("Saved"); render();
}
async function delBet(id){
  const e = S.open["bet-" + id];
  if (!e.confirmDel){ e.confirmDel = true; render(); setTimeout(() => { if (S.open["bet-" + id]) { S.open["bet-" + id].confirmDel = false; render(); } }, 3000); return; }
  const d = await sb.from("bets").delete().eq("id", id);
  if (d.error) return toast("Not deleted: " + d.error.message);
  S.bets = S.bets.filter(x => x.id != id); delete S.open["bet-" + id]; toast("Deleted"); render();
}
function copyDay(day){
  const bets = S.bets.filter(b => b.commence_time && bettingDay(b.commence_time) === day)
    .sort((a,b) => new Date(a.commence_time) - new Date(b.commence_time));
  const d = new Date(day + "T12:00:00");
  const dt = d.getDate() + "-" + d.toLocaleDateString("en-GB", { month:"short" });
  const lines = bets.map(b => [dt, b.sport_title || "", b.market, `${b.home} v ${b.away}`, b.outcome,
    b.line === null || b.line === undefined ? "" : +b.line, b.book, b.flag_odds ?? "", b.fair_odds ?? "",
    (+b.odds).toFixed(2), b.edge_pct ?? "", (+b.stake).toFixed(2)].join("\t"));
  const text = lines.join("\n");
  const done = () => toast(`Copied ${bets.length} rows - paste into your tracker`);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch(e) { toast("Copy failed"); } ta.remove();
}

// ====================================================================== LOG
function viewLog(){
  const open = openBets().sort((a,b) => new Date(a.commence_time) - new Date(b.commence_time));
  const settled = S.bets.filter(b => b.result).sort((a,b) => new Date(b.commence_time) - new Date(a.commence_time)).slice(0, 150);
  const seg = `<div class="seg"><button data-act="logview" data-v="open" class="${S.logView === "open" ? "on" : ""}">Open (${open.length})</button>
    <button data-act="logview" data-v="settled" class="${S.logView === "settled" ? "on" : ""}">Settled</button></div>`;
  const arr = S.logView === "open" ? open : settled;
  if (!arr.length) return seg + `<div class="empty">${S.logView === "open" ? "No open bets." : "Nothing settled yet."}</div>`;
  // group by betting day
  let html = seg, cur = null;
  for (const b of arr){
    const d = bettingDay(b.commence_time);
    if (d !== cur){ if (cur) html += `</div></section>`; cur = d;
      html += `<section><h2><span>${new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" })}</span></h2><div class="list">`; }
    html += betRow(b);
  }
  return html + `</div></section>`;
}

// ====================================================================== SUMMARY
function grp(arr, keyFn){ const m = new Map(); for (const b of arr){ const k = keyFn(b); if (!m.has(k)) m.set(k, []); m.get(k).push(b); } return m; }
function statRow(name, arr){
  const s = arr.filter(b => b.result === "W" || b.result === "L");
  const w = s.filter(b => b.result === "W").length;
  const staked = s.reduce((a,b) => a + +b.stake, 0);
  const pl = arr.filter(b => b.result).reduce((a,b) => a + +b.profit, 0);
  const ev = s.reduce((a,b) => a + (+b.stake) * ((+b.odds)/(+b.fair_odds || +b.odds) - 1), 0);
  const open = arr.filter(b => !b.result);
  return `<tr><td>${esc(name)}</td><td>${arr.length}</td><td>${s.length ? Math.round(100*w/s.length) + "%" : "–"}</td>
    <td class="${pl > 0 ? "pos" : pl < 0 ? "neg" : ""}">${sgn(pl)}</td><td>${staked ? (100*pl/staked).toFixed(1) + "%" : "–"}</td>
    <td>${sgn(ev)}</td><td>${open.length}</td><td>€${open.reduce((a,b)=>a + +b.stake,0).toFixed(0)}</td></tr>`;
}
function table(title, map, order){
  const keys = order ? order.filter(k => map.has(k)) : [...map.keys()].sort((a,b) => map.get(b).length - map.get(a).length);
  return `<section><h2><span>${title}</span></h2><div class="tbl"><table><thead><tr><th></th><th>Bets</th><th>Win</th><th>Profit</th><th>ROI</th><th>EV</th><th>Open</th><th>Open €</th></tr></thead>
    <tbody>${keys.map(k => statRow(k, map.get(k))).join("")}</tbody></table></div></section>`;
}
function viewSummary(){
  const all = S.bets;
  const s = all.filter(b => b.result === "W" || b.result === "L");
  const w = s.filter(b => b.result === "W").length;
  const staked = s.reduce((a,b) => a + +b.stake, 0);
  const pl = all.filter(b => b.result).reduce((a,b) => a + +b.profit, 0);
  const ev = s.reduce((a,b) => a + (+b.stake) * ((+b.odds)/(+b.fair_odds || +b.odds) - 1), 0);
  const expW = s.reduce((a,b) => a + (b.fair_odds ? 1/(+b.fair_odds) : 0), 0);
  const open = openBets(); const openSt = open.reduce((a,b) => a + +b.stake, 0);
  const br = +setting("bankroll", 500);
  const band = b => { const e = +b.edge_pct; return e < 2 ? "Under 2%" : e < 3 ? "2–3%" : e < 5 ? "3–5%" : "5%+"; };
  const oband = b => { const o = +b.odds; return o < 2 ? "Under 2.00" : o < 3 ? "2.00–2.99" : o < 5 ? "3.00–4.99" : "5.00+"; };
  return `<div class="kv" style="margin-top:14px">
      <div class="card"><span>Profit</span><b class="${pl > 0 ? "pos" : pl < 0 ? "neg" : ""}">${sgn(pl)}</b></div>
      <div class="card"><span>Expected (EV)</span><b>${sgn(ev)}</b></div>
      <div class="card"><span>ROI · expected</span><b>${staked ? (100*pl/staked).toFixed(1) : "0"}% · ${staked ? (100*ev/staked).toFixed(1) : "0"}%</b></div>
      <div class="card"><span>Win % · expected</span><b>${s.length ? (100*w/s.length).toFixed(0) : 0}% · ${s.length ? (100*expW/s.length).toFixed(0) : 0}%</b></div>
      <div class="card"><span>Settled · staked</span><b>${s.length} · €${staked.toFixed(0)}</b></div>
      <div class="card"><span>Open · exposure</span><b>${open.length} · ${br ? (100*openSt/br).toFixed(0) : 0}%</b></div></div>
    ${table("By book", grp(all, b => b.book))}
    ${table("By market", grp(all, b => b.market))}
    ${table("By edge at bet", grp(all, band), ["Under 2%","2–3%","3–5%","5%+"])}
    ${table("By odds", grp(all, oband), ["Under 2.00","2.00–2.99","3.00–4.99","5.00+"])}
    ${table("By sport", grp(all, b => b.sport_title || "?"))}
    <section><h2><span>Settings</span></h2><div class="card form" style="margin-top:0;border-top:1px solid var(--line)">
      <div class="frow"><label>Staking bankroll €<input type="number" id="setBankroll" value="${br}"></label>
      <label>Kelly fraction<input type="number" step="0.1" id="setKelly" value="${+setting("kelly_fraction",1)}"></label></div>
      <div class="frow"><label>Stake cap (% of bankroll)<input type="number" step="0.1" id="setCap" value="${(+setting("stake_cap_pct",0.02))*100}"></label>
      <label>Minimum edge %<input type="number" step="0.1" id="setMin" value="${+setting("min_edge_pct",1)}"></label></div>
      <div class="frow"><label>Max odds (flag prices under)<input type="number" step="0.01" id="setMaxOdds" value="${+setting("max_odds",0) || ""}" placeholder="no limit"></label><span></span></div>
      <div class="acts"><button class="btn primary" data-act="save-settings">Save settings</button>
      <button class="btn ghost" data-act="signout" style="margin-left:auto">Sign out</button></div></div></section>`;
}
async function saveSettings(){
  const rows = [["bankroll", +$("setBankroll").value], ["kelly_fraction", +$("setKelly").value],
    ["stake_cap_pct", (+$("setCap").value)/100], ["min_edge_pct", +$("setMin").value], ["max_odds", +$("setMaxOdds").value || 0]].map(([key, value]) => ({ key, value }));
  const u = await sb.from("settings").upsert(rows);
  if (u.error) return toast("Not saved: " + u.error.message);
  rows.forEach(r => S.settings[r.key] = r.value); toast("Settings saved"); render();
}

// update stake / edge / warnings without redrawing the card (keeps the cursor where you're typing)
function liveAccept(id){
  const f = S.flags.find(x => x.id == id), st = S.open[id]; if (!f || !st) return;
  const odds = num(st.odds), fair = +f.fair_odds, auto = kelly(odds, fair, st.book);
  const stake = st.stakeEdited ? num(st.stake) : auto, e = edgePct(odds || 0, fair), b = bookObj(st.book);
  const si = document.querySelector(`[data-f="stake"][data-id="${id}"]`); if (si && !st.stakeEdited) si.value = auto || "";
  const c = $("calc-" + id); if (c) c.textContent = `${e.toFixed(2)}% · Kelly €${auto.toFixed(2)}${b && b.max_win ? ` (cap €${b.max_win} win)` : ""}`;
  const w = $("lowedge-" + id); if (w) w.innerHTML = odds && e < 1 ? `<div class="warn">Edge is ${e.toFixed(2)}%, under 1% at this price. Usually a decline.</div>` : "";
  const cb = $("confirm-" + id); if (cb) cb.disabled = !(odds > 1) || !(stake > 0);
  const box = $("pos-" + id); if (box) box.innerHTML = posPanel(f);
}
// ====================================================================== events
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act],[data-tab]"); if (!t) return;
  if (t.dataset.tab){ TAB = t.dataset.tab; try { localStorage.setItem("edge-tab", TAB); } catch(e) {} render(); window.scrollTo(0,0); return; }
  const act = t.dataset.act, id = t.dataset.id;
  const f = S.flags.find(x => x.id == id);
  if (act === "open-accept"){ const mine = (f.books && f.books.mine) || [], hints = (f.books && f.books.hints) || [];
    const pick = mine[0] ? mine[0].book : (hints[0] || (S.books.find(b => b.active) || {}).name);
    const price = mine[0] ? mine[0].price : f.flag_odds;
    S.open[id] = { mode:"accept", book:pick, odds:price, stake:null, stakeEdited:false, capped:false, max:null }; render(); }
  else if (act === "open-decline"){ S.open[id] = { mode:"decline" }; render(); }
  else if (act === "close"){ delete S.open[id]; render(); }
  else if (act === "accept"){ t.disabled = true; await doAccept(f); }
  else if (act === "decline"){ await doDecline(f, t.dataset.r); }
  else if (act === "res"){ await setResult(id, t.dataset.r); }
  else if (act === "edit-bet"){ const b = S.bets.find(x => x.id == id);
    S.open["bet-" + id] = S.open["bet-" + id] ? undefined : { odds:b.odds, stake:b.stake, book:b.book, result:b.result || "" };
    if (!S.open["bet-" + id]) delete S.open["bet-" + id]; render(); }
  else if (act === "close-bet"){ delete S.open["bet-" + id]; render(); }
  else if (act === "save-bet"){ await saveBet(id); }
  else if (act === "del-bet"){ await delBet(id); }
  else if (act === "day"){ const d = new Date((S.day || todayDay()) + "T12:00:00"); d.setDate(d.getDate() + (+t.dataset.d)); S.day = localISO(d); render(); }
  else if (act === "copy-day"){ copyDay(t.dataset.day); }
  else if (act === "logview"){ S.logView = t.dataset.v; render(); }
  else if (act === "save-settings"){ await saveSettings(); }
  else if (act === "signout"){ await sb.auth.signOut(); showLogin(); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.f){ const st = S.open[t.dataset.id]; if (!st) return;
    if (t.dataset.f === "odds"){ st.odds = t.value; liveAccept(t.dataset.id); return; }
    if (t.dataset.f === "stake"){ st.stake = t.value; st.stakeEdited = true;
      liveAccept(t.dataset.id); return; }
    if (t.dataset.f === "max") { st.max = t.value; return; }
    if (t.dataset.f === "book") { st.book = t.value; st.stakeEdited = false; }
    if (t.dataset.f === "capped") st.capped = t.checked;
    // re-render the card but keep the cursor in the price box
    const pos = t.selectionStart, field = t.dataset.f;
    render();
    const again = document.querySelector(`[data-f="${field}"][data-id="${t.dataset.id}"]`);
    if (again && field === "odds"){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(e) {} }
  }
  if (t.dataset.bf){ const e = S.open["bet-" + t.dataset.id]; if (e) e[t.dataset.bf] = t.value; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.f === "book" || t.dataset.f === "capped") t.dispatchEvent(new Event("input", { bubbles:true }));
});
$("refreshBtn").addEventListener("click", () => refresh(false));

// ====================================================================== auth
function showLogin(){ $("appView").hidden = true; $("loginView").hidden = false; }
async function showApp(){ $("loginView").hidden = true; $("appView").hidden = false; await refresh(true); }
$("loginForm").addEventListener("submit", async ev => {
  ev.preventDefault(); $("loginErr").hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("password").value });
  if (error){ $("loginErr").textContent = error.message; $("loginErr").hidden = false; return; }
  showApp();
});
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) showApp(); else showLogin();
})();
// refresh when you come back to the app, and every 2 minutes while open
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("appView").hidden) refresh(true); });
setInterval(() => { if (!document.hidden && !$("appView").hidden && !Object.keys(S.open).length) refresh(true); }, 120000);
</script>
